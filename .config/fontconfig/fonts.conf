<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Arabic readability: prefer a clean sans for UI/web, Naskh for serif/body. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>
</fontconfig>
