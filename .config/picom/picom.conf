#
# picom — compositor for the i3 conky rice.
#

backend = "glx";
vsync = true;

# Fading: the smooth show/hide you get switching workspaces.
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# Animate window geometry changes (size + position) — this is what makes
# fullscreen <-> windowed (and tiling rearrangements) transition smoothly.
animations = (
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.22;
  }
);
